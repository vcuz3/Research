[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-research-ingestion"
version = "0.1.0"
description = "Public trading-research ingestion and reading pipeline"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pypdf>=5.0",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
email = [
  "google-api-python-client>=2.160",
  "google-auth>=2.38",
  "google-auth-oauthlib>=1.2",
]
test = ["pytest>=8.0"]

[project.scripts]
research-ingestion = "research_ingestion.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
